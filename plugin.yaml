schema: mcpg.dev/plugin/v1
id: dev.mcpg.audit
name: Audit Log
license: Apache-2.0
description: |
  Append-only, per-request audit trail. Records a structured entry
  for every tool call — identity, tool, arguments (optionally
  redacted), decision, and timing — to a configurable sink.
class: tool_gate
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: []
